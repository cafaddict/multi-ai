# Lead-read guidance, not executable Orca config. Checked locally on 2026-09-14.
version: 2
families: {codex: openai, claude: anthropic}

# Exact identifiers live here. All routes explicitly include effort.
lead:
  primary: {agent: codex, model: gpt-6-astra, effort: xhigh}
  fallback: {agent: claude, model: claude-fable-5, effort: xhigh}

roles:
  architect:
    primary: {agent: claude, model: claude-fable-5, effort: high}
    fallback: {agent: claude, model: claude-opus-5, effort: high}
  engineer:
    primary: {agent: codex, model: gpt-5.6-sol, effort: high}
    fallback: {agent: claude, model: claude-opus-5, effort: high}
  researcher:
    primary: {agent: codex, model: gpt-5.6-sol, effort: high}
    fallback: {agent: claude, model: claude-opus-5, effort: high}
  reviewer:
    by_maker_family:
      openai:
        primary: {agent: claude, model: claude-fable-5, effort: high}
        fallback: {agent: claude, model: claude-opus-5, effort: high}
      anthropic:
        primary: {agent: codex, model: gpt-6-astra, effort: high}
        fallback: {agent: codex, model: gpt-5.6-sol, effort: high}

# Used only when HARD/CRITICAL justifies independent solution lanes.
competition:
  lanes:
    primary_family:
      primary: {agent: codex, model: gpt-5.6-sol, effort: high}
      fallback: {agent: codex, model: gpt-6-astra, effort: high}
    alternate_family:
      primary: {agent: claude, model: claude-opus-5, effort: high}
      fallback: {agent: claude, model: claude-fable-5, effort: high}

revision_rounds: 2
